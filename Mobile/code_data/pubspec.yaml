name: code_data
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^8.0.0 
  intl: ^0.17.0
  flutter_pdfview: ^1.0.0
  pdf: ^3.6.0
  jwt_decoder: ^2.0.1
  path_provider: ^2.0.11
  http: ^0.13.5
  provider: ^6.0.0 
  sqflite: ^2.0.0  
  path: ^1.8.0    

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true
  assets:
    - img/imgCodeData.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "img/icone.png"
  remove_alpha_ios: true

